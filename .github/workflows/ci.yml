name: Frontend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js FIRST (Ensures the environment is solid)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install pnpm SECOND (Registers correctly on top of Node 22)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. Clean dependency installation (Bypasses local lockfile strictness mismatches)
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # 4. Compile the React Project
      - name: Build
        run: pnpm build
