name: Frontend CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# دسترسی‌های لازم برای دیپلوی در GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

       Sir, # رفع مشکل احتمالی قفل بودن dependencyها
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # تنظیم محیط گیت‌هاب پیجز
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # آپلود پوشه خروجی Vite (که نام آن dist است)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # دیپلوی نهایی روی گیت‌هاب پیجز (فقط زمان Push روی develop انجام می‌شود)
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/deploy-pages@v4
